[project]
name = "pg-cache-advisor"
version = "0.4.0"  # keep equal to src/version.py (tests/unit/test_versions.py checks)
description = "Agent Powered Caching Assessment Tool: should a self-managed PostgreSQL workload get a cache, for which queries and tables, and at what cost"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT-0"}

dependencies = [
    # Web framework & API
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.49.0",

    # Data validation
    "pydantic>=2.7.2",

    # AWS SDK (Bedrock, Pricing API, S3, STS)
    "boto3>=1.34.0",

    # SQL parsing for query classification and Cache Efficiency inputs.
    # Pinned: the parser relies on its node types (Parameter, Placeholder, ...).
    "sqlglot==30.19.0",

    # Agent framework for the AI review in ANALYZE (use_llm). Without it a run with
    # use_llm completes on the score bands, now with an analyze warning (or fails with
    # require_llm). Pinned to the version the AI review was verified with.
    "strands-agents==1.57.1",

    # Config & logging
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
]

# Dependencies intentionally NOT carried over from the upstream repo:
#   mysql-connector-python, pymssql  — non-PostgreSQL engines, out of scope
#   pymongo, opensearch-py           — non-cache migration targets
#   python-pptx, reportlab           — deck/PDF report generation, out of scope
#   ladybug                          — embedded graph layer, out of scope
#   psycopg2-binary                  — NOT needed: all SQL runs through psql on
#                                      the database host over SSH, so the tool
#                                      never opens a direct DB connection

[project.scripts]
# The CLI coding agents drive (Claude Code, Codex, Kiro): `apcat guide`. Spec .kiro/specs/agent-skill.
apcat = "src.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",   # FastAPI TestClient, used by tests/unit/test_api.py
    "ruff>=0.1.6",
    "mypy>=1.16.0",
    "bandit>=1.7.6",
]
# The agent evaluation (tests/agent_eval): drives real Claude Code sessions. Not in CI.
eval = [
    "claude-agent-sdk>=0.2.178",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
# tests/manual is excluded: those scripts require a live database and are run by
# hand to validate new functions before they are integrated into src/.
testpaths = ["tests/unit", "tests/contract"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "contract: contract validation tests",
    "integration: integration tests requiring real infrastructure",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]
