AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECDL initial load — a run-once Fargate task that reads the current contents of a
  table straight from the source and writes them into the target cache, bypassing
  Debezium and the broker entirely.

  WHY THIS EXISTS. `mode: initial_load` had no deployable artifact at all: the
  parallel loader could only be run as a local python3 process from a laptop or a
  bastion, so an initial load was never something the control plane could do. It
  also means a load no longer depends on whoever ran it having source and cache
  reachability, the right Python packages, and the database password on their
  machine.

  This stack creates the TASK DEFINITION and its networking; it does not run
  anything. The control plane calls RunTask once per table, which is what makes it
  a load rather than a service: the container reads, writes, and exits.

Parameters:
  PermissionsBoundaryArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+)?$'
    Description: >
      Permissions boundary for this stack's task roles. The control plane always
      sets it (its own IAM policy refuses to create a role without it); empty
      leaves the roles without one.

  ClusterName:
    Type: String
    Description: Existing ECS cluster to run the load task in.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      DISABLED by default. This task holds a database credential, and a Fargate
      task with a public IP is internet-reachable unless a security group says
      otherwise. ENABLED is only for a subnet with no NAT, where the task would
      otherwise be unable to reach Secrets Manager.

  # --- Source ---
  SourceEngine:
    Type: String
    AllowedValues: [mysql, postgresql, sqlserver, oracle]
    Description: >
      Selects the loader's database adapter. Same engine_family value the CDC
      stack uses, from ecdl_link/resolve.py.
  SourceDBHost:
    Type: String
  SourceDBPort:
    Type: String
    Default: '3306'
  SourceDBName:
    Type: String
  SourceDBUser:
    Type: String
  DBSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the source DB password (plaintext, or JSON with DBSecretJsonKey).
  KeyPrefix:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9_.-]*$'
    Description: >
      advanced.key_prefix from the link. Keys become <prefix>:<table>:<pk>, so two
      links writing tables of the same name into one cache do not overwrite each
      other. Empty = <table>:<pk>.
  DBSecretJsonKey:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9_]*$'
    Description: >
      Key to read from a JSON secret, e.g. `password` for an RDS-managed admin
      secret ({"username": ..., "password": ...}). Empty = the secret value is
      the password itself (plaintext). Set by the control plane from the
      secret's metadata; without it a JSON secret was injected whole and the
      database refused the login.
  SourceTLS:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Verified TLS to the source (certificate and host name, against the RDS CA
      bundle and the system CAs in the image). false only for an external
      source whose link sets tls false.
  SourceSecurityGroupId:
    Type: String
    Default: ''
    Description: >
      Security group on an AWS source; ingress from the load task is added to it.
      Leave empty for an external (self-managed / on-premises) source, which has
      no AWS security group -- the operator opens their own firewall over Direct
      Connect / VPN.

  # --- Target ---
  TargetHost:
    Type: String
  TargetPort:
    Type: String
    Default: '6379'
  TargetSSL:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  TargetCluster:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Read from the target's ARN, never chosen manually. A non-cluster client
      pointed at a sharded cluster connects and then fails MOVED on most keys, so
      a wrong value here loses the majority of a load.
  TargetSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  TargetSecretArn:
    Type: String
    Default: ''
    Description: >
      Whole Secrets Manager value for the target cache credential; empty when the
      cache has no auth. Plaintext = auth token, JSON {"username","password"} =
      RBAC user. The loader reads this exactly as the sink does, on purpose: the
      two write to the same cache, so a credential that worked for one and not the
      other would cause a confusing partial failure.

  # --- What to load ---
  Tables:
    Type: String
    Description: >
      Comma-separated table names. The loader chunks ONE table by primary-key
      range per run, so the control plane runs the task once per entry.
  SourceTables:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9_$.,]*$'
    Description: >
      The same tables as the source names them (schema.table, or database.table
      for MySQL), positionally matched to Tables. The loader reads this name, so
      a table outside the default schema is the one loaded. Tables stays bare
      because cache keys use the bare name. Empty = read the bare name.
  ProgressKeyBase:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9_.:-]*$'
    Description: >
      Start of the hashes the loader publishes progress to and resumes from,
      ecdl:<link>:bulkload. The loader appends the table's key prefix, so each
      link and table has its own. Empty = ecdl:bulkload.
  PrimaryKeys:
    Type: String
    Default: ''
    Description: >
      Comma-separated, positionally matched to Tables. Leave empty to have the
      loader read each table's primary key from the source, which is the normal
      case -- the control plane often cannot introspect the database itself. A
      default of 'id' here was a guess that surfaced as a task failing on
      "Unknown column 'id'" minutes into a deployment.
  LoaderWorkers:
    Type: String
    Default: '16'
    Description: >
      Parallel primary-key range readers. Note the loader splits the PK range into
      equal chunks, so on a SPARSE key distribution most workers can end up with
      no rows -- pass explicit bounds for that case.
  TransformsJson:
    Type: String
    Default: ''
    Description: >
      Same transform spec the sink uses, so the rows written by the load and the
      rows written by CDC afterwards have identical shape. A load that ignored the
      transforms would populate the cache with rows the CDC path would never
      produce.

  # Empty = this account's own ECR at ImageTag, where `./release.sh push`
  # publishes (see the same parameters in ecdl-cdc-ecs.yaml). It used to be a
  # digest in one development account, which no other account could pull.
  ImageTag:
    Type: String
    Default: 0.2.39
    Description: >
      Version tag of the default loader image in this account's ECR, as
      published by ./release.sh push. `./release.sh pin` sets it to
      VERSION.
  LoaderImage:
    Type: String
    Default: ''
    # Only an ECR image (this account's: the task-role boundary allows pulls
    # from no other registry). An image from anywhere else would run with
    # the pipeline's task role and credentials.
    AllowedPattern: '^$|^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(\.cn)?/[a-z0-9._/-]+(:[A-Za-z0-9._-]+|@sha256:[0-9a-f]{64})$'
    ConstraintDescription: empty, or an ECR image reference (<account>.dkr.ecr.<region>.amazonaws.com/<repo>:<tag> or @sha256:<digest>)
    Description: >
      ECDL bulk-loader image. Empty = <this
      account>.dkr.ecr.<region>/ecdl/ecdl-loader:<ImageTag>.
  FetchBatch:
    Type: String
    Default: ''
    AllowedPattern: '^[0-9]*$'
    Description: >
      Rows per read from the source (advanced.loader.fetch_batch). Empty = 50000,
      lowered for wide rows so every worker's batch fits in TaskMemory.
  # How often the control plane runs the sampled cache check (VerifyTaskDef).
  # 0 for a link that only loads once (mode initial_load): its cache is not
  # kept up to date, so it would differ from the source by design.
  VerifyIntervalMinutes:
    Type: String
    Default: '15'
    AllowedValues: ['0', '5', '10', '15', '30', '60']
  # PostgreSQL only: the link's replication slot, whose lag and wal_status
  # the check reports (review finding H6). The CDC stack has the same value.
  PgSlotName:
    Type: String
    Default: ''
    AllowedPattern: '^[a-z0-9_]*$'
  TaskCpu:
    Type: String
    Default: '2048'
    AllowedValues: ['1024', '2048', '4096', '8192', '16384']
  TaskMemory:
    Type: String
    Default: '4096'
    Description: Must be a valid Fargate pairing for TaskCpu.
  # Same rule as the CDC stack: the architecture must match the image. Without a
  # RuntimePlatform Fargate runs X86_64, so an arm64-only build fails with
  # "exec format error".
  CpuArchitecture:
    Type: String
    Default: X86_64
    AllowedValues: [X86_64, ARM64]
    Description: >
      Fargate CPU architecture for the load task. X86_64 for amd64 or multi-arch
      images, ARM64 for arm64 or multi-arch images.

  # A failed load used to raise no alarm: the deployer reports it, but a load
  # run by hand, or one whose control plane stopped mid-load, failed silently.
  AlarmsEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Notify the load alarm topic when a load task stops with an error.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email address subscribed to the load alarm topic.

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]
  Alarms: !Equals [!Ref AlarmsEnabled, 'true']
  AlarmsWithEmail: !And [!Condition Alarms, !Not [!Equals [!Ref AlarmEmail, '']]]
  HasDBSecretJsonKey: !Not [!Equals [!Ref DBSecretJsonKey, '']]
  HasTargetSecret: !Not [!Equals [!Ref TargetSecretArn, '']]
  # An AWS source supplies its security group so the load task can be granted
  # ingress; an external source leaves it empty, so the rule is skipped.
  HasSourceSecurityGroup: !Not [!Equals [!Ref SourceSecurityGroupId, '']]
  HasLoaderImage: !Not [!Equals [!Ref LoaderImage, '']]
  Verify: !Not [!Equals [!Ref VerifyIntervalMinutes, '0']]

Resources:
  # ═══════════════════════════════════════════════════════════════
  # Networking. A dedicated SG for the load task, with ingress added to the
  # source and the target rather than opening either to a CIDR.
  # ═══════════════════════════════════════════════════════════════
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      guard:
        # Egress to 0.0.0.0/0 is limited to TCP 443 (the AWS APIs, which are
        # public endpoints with no managed prefix list) and, only when the
        # source's security group is unknown, the source database port.
        SuppressedRules:
          - EC2_SECURITY_GROUP_EGRESS_OPEN_TO_WORLD_RULE
    Properties:
      GroupDescription: !Sub '${AWS::StackName} ECDL initial-load task SG'
      VpcId: !Ref VpcId
      # Only what the load task talks to. DNS, the task metadata endpoint and
      # IMDS are not filtered by security groups. HTTPS stays open to any
      # address because the AWS APIs are public endpoints from this subnet.
      SecurityGroupEgress:
        - Description: HTTPS to the AWS APIs (ECR, Secrets Manager, CloudWatch Logs)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: The target cache
          IpProtocol: tcp
          FromPort: !Ref TargetPort
          ToPort: !Ref TargetPort
          DestinationSecurityGroupId: !Ref TargetSecurityGroupId
        # The source database: its own security group when known, otherwise
        # its port only.
        - Description: The source database (initial load)
          IpProtocol: tcp
          FromPort: !Ref SourceDBPort
          ToPort: !Ref SourceDBPort
          DestinationSecurityGroupId: !If [HasSourceSecurityGroup, !Ref SourceSecurityGroupId, !Ref 'AWS::NoValue']
          CidrIp: !If [HasSourceSecurityGroup, !Ref 'AWS::NoValue', 0.0.0.0/0]
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-task-sg'

  SourceIngressFromTask:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSourceSecurityGroup
    Properties:
      Description: !Sub 'ECDL ${AWS::StackName} initial load from the source database'
      GroupId: !Ref SourceSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref SourceDBPort
      ToPort: !Ref SourceDBPort
      SourceSecurityGroupId: !Ref TaskSecurityGroup

  TargetIngressFromTask:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: !Sub 'ECDL ${AWS::StackName} initial load to the target cache'
      GroupId: !Ref TargetSecurityGroupId
      IpProtocol: tcp
      # The target's own port. It was hardcoded to 6379, so a target on another
      # port got an ingress rule the loader could not use.
      FromPort: !Ref TargetPort
      ToPort: !Ref TargetPort
      SourceSecurityGroupId: !Ref TaskSecurityGroup

  # ═══════════════════════════════════════════════════════════════
  # IAM
  # ═══════════════════════════════════════════════════════════════
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - !Ref ExecutionRolePolicy

  ExecutionRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub '${AWS::StackName} ReadLoadSecrets (was an inline policy on ExecutionRole)'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: !Ref DBSecretArn
          # Present only when a cache credential was supplied, so a no-auth
          # deployment does not carry an unused permission.
          - !If
            - HasTargetSecret
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref TargetSecretArn
            - !Ref 'AWS::NoValue'
          # Jira story F177. A secret encrypted with a customer managed key also needs
          # kms:Decrypt, or the task fails at start. Only through Secrets
          # Manager and only for these secrets (their ARN is in the encryption
          # context), so the key ARNs are not needed. A key in another account
          # also needs its key policy to admit this role.
          - Effect: Allow
            Action: [kms:Decrypt]
            Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                kms:EncryptionContext:SecretARN:
                  - !Ref DBSecretArn
                  - !If [HasTargetSecret, !Ref TargetSecretArn, !Ref DBSecretArn]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      # The loader talks to the source and the target and nothing else. It needs
      # no AWS API access at runtime: the secrets arrive as injected environment
      # variables, fetched by the EXECUTION role before the container starts.
      # So it has no policies at all (the control plane may not write inline
      # role policies).

  # Customer-managed key for the loader's logs; CloudWatch Logs is admitted
  # only for this stack's log group (encryption-context condition). ~$1/month.
  LogKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub 'Encrypts the ${AWS::StackName} logs and load alarm topic'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersThroughIam
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          # The load alarm topic is encrypted with this key; EventBridge
          # publishes to it, so it may use the key, for this account only.
          - Sid: EventBridgeForTheLoadAlarmTopic
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: [kms:Decrypt, kms:GenerateDataKey*]
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: CloudWatchLogsForThisStacksLogGroup
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action: [kms:Encrypt*, kms:Decrypt*, kms:ReEncrypt*, kms:GenerateDataKey*, kms:Describe*]
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AWS::StackName}'
      Tags:
        - Key: ecdl:stack
          Value: !Ref AWS::StackName
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 14
      KmsKeyId: !GetAtt LogKey.Arn

  # ═══════════════════════════════════════════════════════════════
  # The load alarm: ECS reports every task stop to EventBridge; a load task
  # that stopped with a non-zero exit code, or never started, is sent to this
  # topic. Subscribe to LoadAlarmTopicArn (or set AlarmEmail).
  # ═══════════════════════════════════════════════════════════════
  LoadAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: Alarms
    Properties:
      DisplayName: !Sub 'ECDL ${AWS::StackName} load alarms'
      KmsMasterKeyId: !Ref LogKey
  LoadAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: AlarmsWithEmail
    Properties:
      TopicArn: !Ref LoadAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail
  # Only this stack's rule may publish. Account principals keep the access
  # their IAM policies give them.
  LoadAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: Alarms
    Properties:
      Topics: [!Ref LoadAlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ThisStacksRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref LoadAlarmTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${AWS::StackName}-load-failed'
  LoadFailedRule:
    Type: AWS::Events::Rule
    Condition: Alarms
    Properties:
      Name: !Sub '${AWS::StackName}-load-failed'
      Description: A load task stopped with an error
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}']
          group: [!Sub 'family:${AWS::StackName}']
          lastStatus: [STOPPED]
          $or:
            - containers:
                exitCode: [{ anything-but: 0 }]
            - stopCode: [TaskFailedToStart]
      Targets:
        - Id: load-alarm-topic
          Arn: !Ref LoadAlarmTopic
          InputTransformer:
            InputPathsMap:
              task: $.detail.taskArn
              code: '$.detail.containers[0].exitCode'
              why: $.detail.stoppedReason
            InputTemplate: !Sub '"ECDL load failed (${AWS::StackName}): task <task> exited <code>. <why> The log is in /ecs/${AWS::StackName}; see docs/operations.md, A failed or interrupted bulk load."'

  # ═══════════════════════════════════════════════════════════════
  # The task definition. Deliberately not a service: a load runs to completion
  # and exits, and a service would restart it forever.
  # ═══════════════════════════════════════════════════════════════
  LoaderTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: loader
          Image: !If
            - HasLoaderImage
            - !Ref LoaderImage
            - !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/ecdl/ecdl-loader:${ImageTag}'
          Essential: true
          # An init process as PID 1, so SIGTERM from stop_task reaches the
          # loader (which also handles it) instead of being ignored until the
          # SIGKILL 30 s later. The deployer resumes capture only after the
          # task is STOPPED.
          LinuxParameters:
            InitProcessEnabled: true
          # TABLE and PRIMARY_KEY are supplied per run as a RunTask container
          # override, because one run loads one table. Everything else is fixed
          # for the link and lives here.
          Environment:
            - { Name: SOURCE_ENGINE, Value: !Ref SourceEngine }
            - { Name: SOURCE_DB_HOST, Value: !Ref SourceDBHost }
            - { Name: SOURCE_DB_PORT, Value: !Ref SourceDBPort }
            - { Name: SOURCE_DB_NAME, Value: !Ref SourceDBName }
            - { Name: SOURCE_DB_USER, Value: !Ref SourceDBUser }
            - { Name: SOURCE_TLS, Value: !Ref SourceTLS }
            - { Name: VALKEY_HOST, Value: !Ref TargetHost }
            - { Name: VALKEY_PORT, Value: !Ref TargetPort }
            - { Name: VALKEY_SSL, Value: !Ref TargetSSL }
            - { Name: VALKEY_CLUSTER, Value: !Ref TargetCluster }
            - { Name: LOADER_WORKERS, Value: !Ref LoaderWorkers }
            - { Name: FETCH_BATCH, Value: !Ref FetchBatch }
            - { Name: TASK_MEMORY_MB, Value: !Ref TaskMemory }
            - { Name: TRANSFORMS_JSON, Value: !Ref TransformsJson }
            - { Name: TABLES, Value: !Ref Tables }
            - { Name: SOURCE_TABLES, Value: !Ref SourceTables }
            - { Name: LINK_KEY_PREFIX, Value: !Ref KeyPrefix }
            - { Name: PRIMARY_KEYS, Value: !Ref PrimaryKeys }
            - { Name: PROGRESS_KEY_BASE, Value: !Ref ProgressKeyBase }
            # Part of a load's resume identity: a link deleted and created
            # again has a new stack and does not resume the old one's load.
            - { Name: LOADER_STACK_ID, Value: !Ref 'AWS::StackId' }
          Secrets:
            - Name: SOURCE_DB_PASSWORD
              ValueFrom: !If
                - HasDBSecretJsonKey
                - !Sub '${DBSecretArn}:${DBSecretJsonKey}::'
                - !Ref DBSecretArn
            - !If
              - HasTargetSecret
              - Name: VALKEY_SECRET
                ValueFrom: !Ref TargetSecretArn
              - !Ref 'AWS::NoValue'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: loader

  # ═══════════════════════════════════════════════════════════════
  # The sampled check of the cache against the source (review finding C1;
  # data-plane/bulk-loader/verify.py). The loader image in verify mode: it
  # reads a few hundred rows of each table and the same keys in the cache,
  # writes nothing, and logs one JSON line per run, which the filters below
  # turn into ECDL/Verify metrics. A family of its own, so the deployer and
  # the load alarm never take a check for a load. The control plane runs it
  # every VerifyIntervalMinutes.
  # ═══════════════════════════════════════════════════════════════
  VerifyTaskDef:
    Type: AWS::ECS::TaskDefinition
    Condition: Verify
    Properties:
      Family: !Sub '${AWS::StackName}-verify'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: loader
          Image: !If
            - HasLoaderImage
            - !Ref LoaderImage
            - !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/ecdl/ecdl-loader:${ImageTag}'
          Essential: true
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - { Name: ECDL_MODE, Value: verify }
            - { Name: SOURCE_ENGINE, Value: !Ref SourceEngine }
            - { Name: SOURCE_DB_HOST, Value: !Ref SourceDBHost }
            - { Name: SOURCE_DB_PORT, Value: !Ref SourceDBPort }
            - { Name: SOURCE_DB_NAME, Value: !Ref SourceDBName }
            - { Name: SOURCE_DB_USER, Value: !Ref SourceDBUser }
            - { Name: SOURCE_TLS, Value: !Ref SourceTLS }
            - { Name: VALKEY_HOST, Value: !Ref TargetHost }
            - { Name: VALKEY_PORT, Value: !Ref TargetPort }
            - { Name: VALKEY_SSL, Value: !Ref TargetSSL }
            - { Name: VALKEY_CLUSTER, Value: !Ref TargetCluster }
            - { Name: TRANSFORMS_JSON, Value: !Ref TransformsJson }
            - { Name: TABLES, Value: !Ref Tables }
            - { Name: SOURCE_TABLES, Value: !Ref SourceTables }
            - { Name: LINK_KEY_PREFIX, Value: !Ref KeyPrefix }
            - { Name: PRIMARY_KEYS, Value: !Ref PrimaryKeys }
            - { Name: PROGRESS_KEY_BASE, Value: !Ref ProgressKeyBase }
            - { Name: PG_SLOT_NAME, Value: !Ref PgSlotName }
          Secrets:
            - Name: SOURCE_DB_PASSWORD
              ValueFrom: !If
                - HasDBSecretJsonKey
                - !Sub '${DBSecretArn}:${DBSecretJsonKey}::'
                - !Ref DBSecretArn
            - !If
              - HasTargetSecret
              - Name: VALKEY_SECRET
                ValueFrom: !Ref TargetSecretArn
              - !Ref 'AWS::NoValue'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: verify
  # One datum per run and kind, summed over the link's tables, dimension Link.
  VerifyCheckedMetric:
    Type: AWS::Logs::MetricFilter
    Condition: Verify
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.ecdl_verify = "run" }'
      MetricTransformations:
        - { MetricNamespace: ECDL/Verify, MetricName: RowsChecked, MetricValue: $.checked, Dimensions: [{ Key: Link, Value: $.link }] }
  VerifyMissingMetric:
    Type: AWS::Logs::MetricFilter
    Condition: Verify
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.ecdl_verify = "run" }'
      MetricTransformations:
        - { MetricNamespace: ECDL/Verify, MetricName: RowsMissing, MetricValue: $.missing, Dimensions: [{ Key: Link, Value: $.link }] }
  VerifyDifferentMetric:
    Type: AWS::Logs::MetricFilter
    Condition: Verify
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.ecdl_verify = "run" }'
      MetricTransformations:
        - { MetricNamespace: ECDL/Verify, MetricName: RowsDifferent, MetricValue: $.different, Dimensions: [{ Key: Link, Value: $.link }] }
  VerifyExtraMetric:
    Type: AWS::Logs::MetricFilter
    Condition: Verify
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.ecdl_verify = "run" }'
      MetricTransformations:
        - { MetricNamespace: ECDL/Verify, MetricName: RowsExtra, MetricValue: $.extra, Dimensions: [{ Key: Link, Value: $.link }] }
  VerifyUncheckedMetric:
    Type: AWS::Logs::MetricFilter
    Condition: Verify
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.ecdl_verify = "run" }'
      MetricTransformations:
        - { MetricNamespace: ECDL/Verify, MetricName: TablesUnchecked, MetricValue: $.unchecked, Dimensions: [{ Key: Link, Value: $.link }] }
  # The source's own capture health (findings H6, H11), from the "source" line.
  VerifySlotLagMetric:
    Type: AWS::Logs::MetricFilter
    Condition: Verify
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.ecdl_verify = "source" && $.slot_lag_bytes >= 0 }'
      MetricTransformations:
        - { MetricNamespace: ECDL/Verify, MetricName: SourceSlotLagBytes, MetricValue: $.slot_lag_bytes, Dimensions: [{ Key: Link, Value: $.link }] }
  VerifyCaptureAgeMetric:
    Type: AWS::Logs::MetricFilter
    Condition: Verify
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.ecdl_verify = "source" && $.capture_age_seconds >= 0 }'
      MetricTransformations:
        - { MetricNamespace: ECDL/Verify, MetricName: SourceCaptureAgeSeconds, MetricValue: $.capture_age_seconds, Dimensions: [{ Key: Link, Value: $.link }] }

Outputs:
  VerifyTaskDefinitionArn:
    Condition: Verify
    Value: !Ref VerifyTaskDef
    Description: The sampled cache check; the control plane runs it every VerifyIntervalMinutes.
  VerifyIntervalMinutes:
    Value: !Ref VerifyIntervalMinutes
  # Everything RunTask needs, so the caller reads the run configuration back from
  # the stack instead of having to remember what it passed in. SubnetIds and
  # AssignPublicIp are not used by the task definition itself -- a Fargate task
  # gets its network at run time, not at definition time -- so they are echoed
  # here rather than left as write-only parameters.
  TaskDefinitionArn:
    Value: !Ref LoaderTaskDef
    Description: Pass to RunTask, once per table.
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  Subnets:
    Value: !Join [',', !Ref SubnetIds]
  AssignPublicIp:
    Value: !Ref AssignPublicIp
  ClusterName:
    Value: !Ref ClusterName
  LogGroup:
    Value: !Ref LogGroup
  LoadAlarmTopicArn:
    Condition: Alarms
    Value: !Ref LoadAlarmTopic
    Description: Subscribe to it to hear about a failed load.
  Tables:
    Value: !Ref Tables
    Description: The control plane runs the task once per entry.
  RunHint:
    Description: >-
      Only with capture paused (Debezium desired count 0): a load under live
      capture overwrites newer changes with older rows.
    Value: !Sub >-
      aws ecs run-task --cluster ${ClusterName} --task-definition ${LoaderTaskDef}
      --launch-type FARGATE --network-configuration
      "awsvpcConfiguration={subnets=[...],securityGroups=[${TaskSecurityGroup}],assignPublicIp=${AssignPublicIp}}"
      --overrides '{"containerOverrides":[{"name":"loader","environment":[{"name":"TABLE","value":"<table>"}]}]}'
