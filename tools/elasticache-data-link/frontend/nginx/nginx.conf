# nginx for the ECDL control-plane UI: the static files, and /api/* forwarded
# to the backend so the page and the API share one origin (Jira story F155). Run as the
# non-root `nginx` user. Every path nginx writes to (pid, temp files) is under
# /tmp, which that user can write, so the container needs no root at runtime.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # The static files are only read: anything but GET and HEAD gets 405.
  # /api/* takes every method, and the backend decides.
  map $request_method $ecdl_method_ok {
    GET  1;
    HEAD 1;
    default 0;
  }

  server {
    listen 3000;
    root /usr/share/nginx/html;

    # The API, on the page's own origin. ecdl-api.conf sets the upstream
    # (ECDL_API_UPSTREAM) and a resolver; docker-entrypoint.d/40-ecdl-config.sh
    # writes it at start. A variable in proxy_pass makes nginx look the name up
    # per request, so a restarted backend container with a new address is
    # still found.
    # The browser's Host is passed on unchanged: the backend's Host allowlist
    # (backend/auth.py) is what stops DNS rebinding, so it must see the name
    # the page was opened at.
    location /api/ {
      include /etc/nginx/ecdl-api.conf;
      proxy_pass $ecdl_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # The backend refuses bodies over 1 MiB, except a database restore (32 MiB).
      client_max_body_size 32m;
      # Plans and deploys call AWS and can take minutes.
      proxy_read_timeout 300s;
      include /etc/nginx/ecdl-security-headers.conf;
    }

    # Runtime settings: must never be cached, or an AccessMode change would not
    # reach browsers that loaded the page before.
    location = /config.js {
      if ($ecdl_method_ok = 0) {
        return 405;
      }
      include /etc/nginx/ecdl-security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    # Content-hashed build output: safe to cache for a long time.
    location /static/ {
      if ($ecdl_method_ok = 0) {
        return 405;
      }
      include /etc/nginx/ecdl-security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The single-page app: any other path serves index.html.
    location / {
      if ($ecdl_method_ok = 0) {
        return 405;
      }
      include /etc/nginx/ecdl-security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
