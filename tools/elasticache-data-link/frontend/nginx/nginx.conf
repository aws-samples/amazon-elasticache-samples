# nginx for the ECDL control-plane UI: static files only, run as the non-root
# `nginx` user. Every path nginx writes to (pid, temp files) is under /tmp, which
# that user can write, so the container needs no root at runtime.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Only GET and HEAD: this server holds no API, so anything else is refused.
  map $request_method $ecdl_method_ok {
    GET  1;
    HEAD 1;
    default 0;
  }

  server {
    listen 3000;
    root /usr/share/nginx/html;

    if ($ecdl_method_ok = 0) {
      return 405;
    }

    # Runtime settings: must never be cached, or an AccessMode change would not
    # reach browsers that loaded the page before.
    location = /config.js {
      include /etc/nginx/ecdl-security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    # Content-hashed build output: safe to cache for a long time.
    location /static/ {
      include /etc/nginx/ecdl-security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The single-page app: any other path serves index.html.
    location / {
      include /etc/nginx/ecdl-security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
