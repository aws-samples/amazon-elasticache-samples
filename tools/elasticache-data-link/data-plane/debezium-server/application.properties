# ═══════════════════════════════════════════════════════════════════════════
# ECDL — Debezium Server SHARED BASE config
#
# This file holds everything that is the same for every source engine. The
# engine-specific part lives in a sibling file and is selected at runtime by a
# Quarkus profile:
#
#     QUARKUS_PROFILE=mysql        -> also loads application-mysql.properties
#     QUARKUS_PROFILE=postgresql   -> also loads application-postgresql.properties
#     QUARKUS_PROFILE=sqlserver    -> also loads application-sqlserver.properties
#     QUARKUS_PROFILE=oracle       -> also loads application-oracle.properties
#
# The profile names are exactly the `engine_family` values in
# ecdl_link/resolve.py ENGINE_FACTS, so the resolver's output can be passed
# directly to the container with no translation table in between.
#
# WHY THE SPLIT EXISTS. There used to be four complete, independently
# hand-maintained files (application.properties, application-pg,
# application-mssql, application-oracle), roughly 80% identical. They drifted,
# and the drift was not cosmetic: when the broker gained TLS and an auth token
# only the MySQL file was updated, so a PostgreSQL, SQL Server or Oracle link
# would fail NOAUTH against the broker this repo now creates. Everything shared
# is stated once here so that cannot happen again.
#
# CONFIG PRECEDENCE (Quarkus/SmallRye, highest first):
#   1. environment variables  DEBEZIUM_SOURCE_SNAPSHOT_MODE=...   (ordinal 300)
#   2. this file + the active profile file                        (ordinal ~260)
# So any property here can be overridden at deploy time without rebuilding the
# image: dot-to-underscore, uppercase. Use that for a one-off override,
# not the normal path -- the normal path is the ${VAR} placeholders below.
#
# Secrets (source DB password, broker auth token) arrive as environment
# variables injected by ECS from Secrets Manager. No secret is stored in the image.
# ═══════════════════════════════════════════════════════════════════════════

# --- Quarkus runtime ---
quarkus.log.console.json=false
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}

# --- Event format (flat JSON, no schema envelope) ---
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# ═══════════════════════════════════════════════════════════════════════════
# SINK: broker Valkey (Redis Streams)
# ═══════════════════════════════════════════════════════════════════════════
debezium.sink.type=redis
debezium.sink.redis.address=${BROKER_HOST}:${BROKER_PORT:6379}
debezium.sink.redis.ssl.enabled=${BROKER_SSL:true}
# Hostname verification stays off: ElastiCache presents a certificate for the
# cluster's own domain and clients reach it through the endpoint DNS name. The
# connection is still encrypted and the endpoint is only reachable in-VPC.
debezium.sink.redis.ssl.hostname.verification.enabled=false
# The broker carries full before-and-after row images, so it is created with an
# auth token. BROKER_PASSWORD is injected by ECS from Secrets Manager. Empty
# means an unauthenticated broker, which is only true of clusters created before
# infra/ecdl-broker-quickstart.yaml started generating a token.
debezium.sink.redis.user=${BROKER_USERNAME:}
debezium.sink.redis.password=${BROKER_PASSWORD:}
debezium.sink.redis.batch.size=${SINK_BATCH_SIZE:2000}
debezium.sink.redis.message.format=extended

# ── Retry: stated, not inherited ────────────────────────────────────────────
# These were all upstream defaults, so how the pipeline behaved during a broker
# failover was whatever Debezium 3.0.6 happened to ship (10 attempts, 300ms
# doubling to 10s: about a minute). An ElastiCache Multi-AZ failover can take
# longer than that, and when the sink stops retrying, Debezium Server exits.
#
# Exiting is SAFE -- nothing is lost: the offset is only committed after the
# broker accepted the batch, ECS restarts the task, and capture resumes from
# the committed position -- but it turns a 60-90s failover into a restart with
# a cold connector. So the budget is sized to last through a failover: 300ms
# doubling to 10s, 40 attempts, roughly six minutes. A broker that is down for
# longer than that still ends in a restart, which the capture-not-running and
# Debezium-errors alarms report.
#
# A full broker (noeviction) answers OOM, which is retried the same way while
# the sink drains it.
debezium.sink.redis.retry.initial.delay.ms=${BROKER_RETRY_INITIAL_MS:300}
debezium.sink.redis.retry.max.delay.ms=${BROKER_RETRY_MAX_MS:10000}
debezium.sink.redis.retry.max.attempts=${BROKER_RETRY_ATTEMPTS:40}
debezium.sink.redis.connection.timeout.ms=${BROKER_CONNECT_TIMEOUT_MS:5000}
debezium.sink.redis.socket.timeout.ms=${BROKER_SOCKET_TIMEOUT_MS:5000}

# ═══════════════════════════════════════════════════════════════════════════
# SOURCE: the parts that are identical for every engine
# The engine profile supplies connector.class, the default port, whichever
# database property that engine uses, and its snapshot default.
# ═══════════════════════════════════════════════════════════════════════════
debezium.source.database.hostname=${SOURCE_DB_HOST}
debezium.source.database.user=${SOURCE_DB_USER}
debezium.source.database.password=${SOURCE_DB_PASSWORD}
debezium.source.topic.prefix=${TOPIC_PREFIX:ecdl}
debezium.source.table.include.list=${TABLE_INCLUDE_LIST}

# decimal.handling.mode=string is required, not a preference: the default
# (precise) emits base64-encoded two's-complement bytes, which a cache client
# reading a Valkey hash field cannot interpret. String keeps the value readable.
debezium.source.decimal.handling.mode=string
debezium.source.include.schema.changes=false
# tombstones.on.delete=false means one delete event, not a delete plus a null.
# The sink maps op='d' to DEL, so a tombstone would be a redundant second event.
debezium.source.tombstones.on.delete=false
debezium.source.heartbeat.interval.ms=${HEARTBEAT_INTERVAL_MS:10000}

# ── Source connection errors: retry, stated rather than inherited ───────────
# errors.max.retries=-1 retries a lost source connection indefinitely (a writer
# failover, a brief network interruption, a source restart) instead of failing the task.
# Each retry restarts the connector after retriable.restart.connector.wait.ms.
# A non-retriable error -- missing grants, a log position the source has
# already purged -- still stops the task, and the Debezium-errors alarm fires.
debezium.source.errors.max.retries=${SOURCE_MAX_RETRIES:-1}
debezium.source.retriable.restart.connector.wait.ms=${SOURCE_RETRY_WAIT_MS:10000}

# Throughput tuning: large read batches and a tight poll so the log reader is
# not throttled, with a deep queue in front of the sink.
debezium.source.max.batch.size=${MAX_BATCH_SIZE:8192}
debezium.source.max.queue.size=${MAX_QUEUE_SIZE:32768}
debezium.source.poll.interval.ms=${POLL_INTERVAL_MS:10}

# ═══════════════════════════════════════════════════════════════════════════
# OFFSET + SCHEMA HISTORY: the broker Valkey itself (Option B — no SQLite/EFS)
#
# Both stores would inherit address, user, password and ssl.enabled from the
# sink if left unset, but all of it is stated explicitly. Inheritance that
# silently stops working -- for example because someone gave the sink its own address
# -- leaves offsets unwritable, and an unwritable offset store is the one
# failure that loses changes rather than delaying them.
#
# The keys are per-link. They used to be the constants ecdl:metadata:offsets
# and ecdl:metadata:schema_history, so two links sharing a broker overwrote
# each other's position.
# ═══════════════════════════════════════════════════════════════════════════
debezium.source.offset.storage=io.debezium.storage.redis.offset.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=${BROKER_HOST}:${BROKER_PORT:6379}
debezium.source.offset.storage.redis.ssl.enabled=${BROKER_SSL:true}
debezium.source.offset.storage.redis.ssl.hostname.verification.enabled=false
debezium.source.offset.storage.redis.user=${BROKER_USERNAME:}
debezium.source.offset.storage.redis.password=${BROKER_PASSWORD:}
debezium.source.offset.storage.redis.key=${OFFSET_KEY:ecdl:metadata:offsets}
# Each offset commit waits for a replica to acknowledge, which tightens the
# window in which a broker failover could lose a committed position. Set
# BROKER_WAIT=false for a single-node broker, where it can never succeed and
# adds the full timeout to every flush.
debezium.source.offset.storage.redis.wait.enabled=${BROKER_WAIT:true}
debezium.source.offset.storage.redis.wait.timeout.ms=1000
debezium.source.offset.flush.interval.ms=1000

# Schema history is only consulted by connectors that need it (MySQL, SQL
# Server, Oracle). PostgreSQL carries schema in the logical decoding stream and
# ignores these properties, so they are stated once here rather than repeated in
# three of the four profiles.
debezium.source.schema.history.internal=io.debezium.storage.redis.history.RedisSchemaHistory
debezium.source.schema.history.internal.redis.address=${BROKER_HOST}:${BROKER_PORT:6379}
debezium.source.schema.history.internal.redis.ssl.enabled=${BROKER_SSL:true}
debezium.source.schema.history.internal.redis.ssl.hostname.verification.enabled=false
debezium.source.schema.history.internal.redis.user=${BROKER_USERNAME:}
debezium.source.schema.history.internal.redis.password=${BROKER_PASSWORD:}
debezium.source.schema.history.internal.redis.key=${SCHEMA_HISTORY_KEY:ecdl:metadata:schema_history}

# ═══════════════════════════════════════════════════════════════════════════
# SIGNALLING — day-2 changes without a stop-and-recreate
#
# Adding a table to a live link is the operation this exists for. Just adding it
# to table.include.list captures only changes made AFTER the restart, so every
# row that already existed is never sent and the cache is permanently missing
# them. A signal asks the connector for an INCREMENTAL SNAPSHOT of the new table,
# which backfills the existing rows in chunks while streaming continues.
#
# The signalling table is created on the SOURCE database as a prerequisite, and
# must be unique per connector instance -- so it is per link, not shared. See
# ecdl_link/signals.py, which generates the DDL and sends the signals.
#
# Verified on 3.0.6: the connector logs "SignalProcessor started. Scheduling it
# every 5000ms", adds the signalling table to its own capture-schema list without
# it being in table.include.list, and an execute-snapshot request produced the
# pre-existing rows as op='r' events.
#
# SIGNAL_COLLECTION is REQUIRED. It used to be ${SIGNAL_COLLECTION:} -- an
# empty default -- while the channel below is always on, so an unset value
# reached Debezium as the table id '' and the connector restarted repeatedly on
# "Invalid identifier: ''". entrypoint.sh now refuses to start without it and
# says what to set; with no default here, a run that bypasses the entrypoint
# also fails on a missing property rather than deep inside the connector.
# ═══════════════════════════════════════════════════════════════════════════
debezium.source.signal.enabled.channels=source
debezium.source.signal.data.collection=${SIGNAL_COLLECTION}

# ═══════════════════════════════════════════════════════════════════════════
# TRANSFORMS
#
# DropSignal runs FIRST and discards the signalling table's own inserts, which
# would otherwise become a stream in the broker that nothing consumes.
#
# The HEARTBEAT IS NOT DROPPED. It used to be, and that broke first deploys on an
# idle source: Debezium Server commits an offset only for records that reach the
# sink, so with every heartbeat filtered and no table changes, no offset was ever
# written, and the deployer (which must not pause capture without one) stopped waiting and failed.
# The heartbeat is now written to data:__debezium-heartbeat.<prefix>, one entry every
# heartbeat.interval.ms, and the sink trims that stream (TRIM_STREAMS) so it does
# not grow. The dashboard reads only the table streams, so it is not a backlog.
#
# It has to be a Filter, not a router: renaming the topic would still leave the
# records in a stream, just under a different name. Filter DROPS them.
#
# SIGNAL_TOPIC_PATTERN is supplied by the control plane and names the exact
# collections rather than matching a wildcard, so a customer table whose name
# happens to resemble ours is never silently dropped.
#
# AddPrefix then routes every remaining table to its own data:<topic> stream.
# The data: prefix is where the sink's stream names come from; see
# ecdl_link/resolve.py stream_key(), which composes the same name from the ARN so
# the two sides cannot disagree. Topic shape differs per engine and is documented
# in each profile file.
# ═══════════════════════════════════════════════════════════════════════════
debezium.transforms=DropSignal,AddPrefix
debezium.transforms.DropSignal.type=org.apache.kafka.connect.transforms.Filter
debezium.transforms.DropSignal.predicate=IsControlTraffic
debezium.predicates=IsControlTraffic
debezium.predicates.IsControlTraffic.type=org.apache.kafka.connect.transforms.predicates.TopicNameMatches
debezium.predicates.IsControlTraffic.pattern=${SIGNAL_TOPIC_PATTERN:^$}
debezium.transforms.AddPrefix.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.AddPrefix.regex=.*
debezium.transforms.AddPrefix.replacement=data:$0
