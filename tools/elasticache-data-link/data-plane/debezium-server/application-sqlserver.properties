# ═══════════════════════════════════════════════════════════════════════════
# ECDL — SQL Server source.  Activated by QUARKUS_PROFILE=sqlserver.
# Everything shared lives in application.properties.
#
# Supersedes application-mssql.properties (a complete standalone copy, drifted:
# no broker user/password, BROKER_SSL defaulted false). The engine findings from
# that file are preserved below; see docs/benchmark-results.md.
#
# What is peculiar to SQL Server:
#   1. IT IS NOT LOG STREAMING, and this is the single most important thing to
#      know. A SQL Server Agent capture job asynchronously copies changes into
#      cdc.<capture_instance>_CT tables and this connector POLLS those tables over
#      T-SQL. Two hops, and the CAPTURE JOB -- not Debezium -- sets the lower limit on
#      latency. Its own pollinginterval defaults to 5 SECONDS
#      (sys.sp_cdc_change_job), which measured p50 4,859 ms end to end; setting it
#      to 0 (continuous) measured p50 18.3 ms, a 265x difference. No property in
#      this file can improve on that, so tune the capture job first.
#      Debezium behaves identically on EC2, RDS, Azure MI and on-prem: there is
#      no alternative capture mechanism to switch to, unlike Oracle.
#   2. database.names (PLURAL) is the database property -- the only one of the
#      four engines that takes a list here.
#   3. Topic shape is <prefix>.<database>.<schema>.<table>: FOUR segments, one
#      more than MySQL and two more than Oracle. table.include.list, by contrast,
#      takes schema.table with no database qualifier, because the database is
#      already named in database.names.
#   4. database.encrypt must be stated. MSSQL JDBC driver 10+ defaults
#      encrypt=true, so against a server with a self-signed certificate the
#      handshake fails PKIX validation before the connector reads anything. The
#      defaults below (encrypt off, trust on) suit an in-VPC server whose port is
#      restricted by security group. For a wire-encrypted run set
#      SOURCE_DB_ENCRYPT=true and keep SOURCE_DB_TRUST_CERT=true, or install a
#      trusted certificate and set it to false.
#   5. No server id. That is a MySQL replication concept; polling a change table
#      needs no replica identity.
#   6. Monitor COUNT(source) - COUNT(cdc.*_CT) yourself. When the capture job was
#      accidentally left stopped, a real gap in captured changes appeared and sys.dm_cdc_errors was
#      EMPTY. The engine does not report this. (It did fully recover with no loss
#      once the job was restarted correctly.)
# ═══════════════════════════════════════════════════════════════════════════

debezium.source.connector.class=io.debezium.connector.sqlserver.SqlServerConnector
debezium.source.database.port=${SOURCE_DB_PORT:1433}
debezium.source.database.names=${SOURCE_DB_NAME}
# TLS to the source (review finding H1): encrypted, and the certificate must
# chain to a CA in the truststore (RDS's CAs and the system CAs, built into the
# image) and name the host. It used to be encrypt=false, so the password and
# every row crossed the network in plaintext. entrypoint.sh sets
# SOURCE_DB_ENCRYPT=false when the link turns TLS off (SOURCE_TLS=false,
# external sources only: a server with a self-signed certificate or one
# reached by IP address). Note 4 above predates this.
debezium.source.database.encrypt=${SOURCE_DB_ENCRYPT:true}
debezium.source.database.trustServerCertificate=${SOURCE_DB_TRUST_CERT:false}
debezium.source.database.trustStore=${SOURCE_TRUSTSTORE:/debezium/tls/source-truststore.p12}
# Not a secret: the truststore holds public CA certificates only (Dockerfile).
debezium.source.database.trustStorePassword=${SOURCE_TRUSTSTORE_PASSWORD:changeit}
debezium.source.snapshot.mode=${SNAPSHOT_MODE:no_data}

# Cap on transactions pulled per query iteration. 0 = unlimited, which maximises
# throughput; a positive value bounds memory on very large transactions at the
# cost of throughput.
debezium.source.max.iteration.transactions=${MAX_ITERATION_TRANSACTIONS:0}
# Keep-alive for an idle source (SqlServerKeepAlive). Every this many seconds
# the offset store writes and deletes one "log" row in the link's signalling
# table, so the capture job always has a recent transaction. Without it, a link
# deployed on a source with no writes since CDC was enabled failed every poll
# with error 313 and never streamed. Needs INSERT and DELETE on the signalling
# table, which must be CDC-enabled. 0 turns it off.
debezium.source.offset.storage.ecdl.sqlserver.keepalive.seconds=${SQLSERVER_KEEPALIVE_SECONDS:300}
