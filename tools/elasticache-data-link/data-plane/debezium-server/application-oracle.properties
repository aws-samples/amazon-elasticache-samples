# ═══════════════════════════════════════════════════════════════════════════
# ECDL — Oracle source (LogMiner).  Activated by QUARKUS_PROFILE=oracle.
# Everything shared lives in application.properties.
#
# Rewritten from the standalone benchmark config: the shared 80% now comes from
# the base file (which, unlike this file's previous version, can actually talk to
# a broker with TLS and an auth token). The engine findings are preserved below;
# measurements in docs/benchmark-results.md.
#
# What is peculiar to Oracle:
#   1. LOGMINER IS QUERY-BASED, not a streamed log. The connector opens a
#      LogMiner session and SELECTs from V$LOGMNR_CONTENTS -- more similar to
#      SQL Server's change-table polling than to binlog or WAL streaming.
#      Measured shape: 2nd fastest of the four engines on THROUGHPUT (~46,700
#      events/s, ahead of SQL Server and MySQL) but by far the worst on
#      FRESHNESS (p50 ~3,064 ms vs MySQL 7.1 ms). Freshness was extremely tight
#      across samples (2,759-3,209 ms), which indicates a fixed mining
#      cycle rather than load. Throughput and freshness are independent axes
#      here. That 3,064 ms is UNTUNED and should be read as an upper bound: the
#      sleep/batch settings below were left at defaults.
#   2. IDENTIFIERS ARE UPPERCASE. table.include.list must be SCHEMA.TABLE in caps
#      (ADMIN.ORDERS3W), and emitted field names are uppercase, so target keys
#      are written as ORDERS3W:<id> rather than the lowercase orders3w:<id> the other
#      engines produce. Row counts still compare; the key names differ. This is
#      encoded in ecdl_link/resolve.py so the sink is pointed at the right stream.
#   3. Topic shape is <prefix>.<schema>.<table> and OMITS THE DATABASE -- two
#      segments, the shortest of the four. Getting this wrong is silent: Debezium
#      writes one stream, the sink reads another, the broker fills and the target
#      stays empty.
#   4. NO database.pdb.name for a non-CDB. Setting it on a non-CDB instance makes
#      the connector fail at startup, so the property is deliberately absent from
#      this file rather than present with an empty default (an empty pdb name is
#      "set to nothing", which is not the same as unset). For a multitenant
#      instance (oracle-ee-cdb) add it at deploy time as an environment variable:
#        DEBEZIUM_SOURCE_DATABASE_PDB_NAME=ORCLPDB1
#      Environment variables take precedence over this file, so nothing needs rebuilding.
#   5. log.mining.strategy=online_catalog reads the current data dictionary
#      instead of writing a dictionary copy into redo. Far cheaper, and what you
#      want for throughput; the cost is that it cannot track DDL for tables whose
#      schema changes mid-capture.
#   6. SUPPLEMENTAL LOGGING IS MANDATORY and is set outside this file, on the
#      database and on each captured table:
#        ALTER TABLE <t> ADD SUPPLEMENTAL LOG DATA (ALL) COLUMNS;
#      Without it LogMiner emits incomplete before/after images.
#   7. ojdbc IS bundled. debezium/server 3.0.6.Final ships ojdbc11 + orai18n
#      (verified by listing /debezium/lib in the image), so contrary to older
#      guidance no driver needs adding.
# ═══════════════════════════════════════════════════════════════════════════

debezium.source.connector.class=io.debezium.connector.oracle.OracleConnector
debezium.source.database.port=${SOURCE_DB_PORT:1521}
debezium.source.database.dbname=${SOURCE_DB_NAME}
# Empty default = no schema filter. That is safe because table.include.list is
# already SCHEMA.TABLE, so the schema is constrained there; this only narrows the
# set of schemas LogMiner is asked about. An unset variable with no default would
# refuse to start, which is an unreasonable cost for a filter that is only an optimisation.
debezium.source.schema.include.list=${SCHEMA_INCLUDE_LIST:}
debezium.source.snapshot.mode=${SNAPSHOT_MODE:no_data}

# ── LogMiner tuning ────────────────────────────────────────────────────────
debezium.source.log.mining.strategy=${LOG_MINING_STRATEGY:online_catalog}
# Adaptive batching: the connector grows and shrinks its SCN window to keep each
# mining query bounded. These decide how much redo one V$LOGMNR_CONTENTS query
# has to process, and they are the first place to look for the freshness
# figure in note 1.
debezium.source.log.mining.batch.size.min=${MINING_BATCH_MIN:1000}
debezium.source.log.mining.batch.size.max=${MINING_BATCH_MAX:100000}
debezium.source.log.mining.batch.size.default=${MINING_BATCH_DEFAULT:20000}
debezium.source.log.mining.sleep.time.min.ms=${MINING_SLEEP_MIN:0}
debezium.source.log.mining.sleep.time.max.ms=${MINING_SLEEP_MAX:200}
debezium.source.log.mining.sleep.time.default.ms=${MINING_SLEEP_DEFAULT:20}
# Mine the ONLINE redo as well as archived logs. Archive-only mode would wait for
# a log switch, adding minutes of artificial latency.
debezium.source.log.mining.archive.log.only.mode=false
debezium.source.log.mining.archive.log.hours=${MINING_ARCHIVE_HOURS:24}
