# ═══════════════════════════════════════════════════════════════════════════
# ECDL — MySQL / Aurora MySQL source.  Activated by QUARKUS_PROFILE=mysql.
# Everything shared lives in application.properties; only the differences are
# here. Do not restate a shared property unless MySQL genuinely needs a
# different value -- restating it is how the old four-file layout drifted.
#
# What is peculiar to MySQL:
#   1. It TAILS THE BINLOG as a replication client, so it needs a server id that
#      is unique across every replica of that server. SERVER_ID is derived from
#      the link name by ecdl_link/resolve.py mysql_server_id(); it used to be the
#      constant 88888, so two links against one source silently competed for the
#      replication slot.
#   2. database.include.list is the database property. PostgreSQL and Oracle use
#      database.dbname and SQL Server uses database.names.
#   3. Topic shape is <prefix>.<database>.<table>, so a table is written to
#      data:<prefix>.<database>.<table> -- three segments, one fewer than
#      SQL Server, one more than Oracle.
#   4. snapshot.mode=no_data: the parallel bulk loader does the data, and
#      Debezium reads only the schema, which MySQL needs for its schema history.
#      It used to be schema_only, the same mode under the name Debezium 3.0
#      deprecates (Jira story F016). Set SNAPSHOT_MODE=initial to have Debezium do the
#      initial load instead of the bulk loader.
#   5. snapshot.locking.mode (Jira story F012). Upstream's default, minimal, takes FLUSH
#      TABLES WITH READ LOCK (or LOCK TABLES ... READ, where a global lock is not
#      allowed, as on RDS) on the writer while it reads the schema, on every
#      start without a stored offset. Queued behind a long query, that lock
#      stops every write to the database. entrypoint.sh sets
#      SNAPSHOT_LOCKING_MODE=none when Debezium reads no data (no_data, the
#      default), so no lock is taken and RELOAD and LOCK TABLES are not needed.
#      The cost: DDL that runs during those few seconds can be recorded twice,
#      which Debezium tolerates. When Debezium reads the data itself (initial,
#      when_needed) the lock is what makes the snapshot consistent with the
#      binlog position, so it stays minimal. Without the entrypoint the default
#      below is upstream's.
# ═══════════════════════════════════════════════════════════════════════════

debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.port=${SOURCE_DB_PORT:3306}
debezium.source.database.include.list=${SOURCE_DB_NAME}
debezium.source.database.server.id=${SERVER_ID}
debezium.source.snapshot.mode=${SNAPSHOT_MODE:no_data}
debezium.source.snapshot.locking.mode=${SNAPSHOT_LOCKING_MODE:minimal}
