# ═══════════════════════════════════════════════════════════════════════════
# ECDL — PostgreSQL / Aurora PostgreSQL source.
# Activated by QUARKUS_PROFILE=postgresql.
# Everything shared lives in application.properties.
#
# Supersedes application-pg.properties, which was a complete standalone copy and
# had drifted: it had no broker user/password and defaulted BROKER_SSL to false,
# so it could not connect to the broker this repo now creates (TLS + auth token).
#
# What is peculiar to PostgreSQL:
#   1. It streams the WAL through LOGICAL DECODING, which requires a REPLICATION
#      SLOT on the server. The slot is stateful and server-side: an INACTIVE slot
#      retains WAL indefinitely and will eventually fill the source's disk. Drop the
#      slot when a link is deleted -- that is the one piece of source-side
#      cleanup no other engine needs (`ecdl destroy` prints the statement).
#      The slot is PER LINK: the CDC stack sets SLOT_NAME=ecdl_<link>, so two
#      links on one source no longer share a single slot. ecdl_slot below
#      is the fallback for stacks created before that, which keep it.
#      The publication is PER LINK too: the CDC stack sets
#      PUBLICATION=ecdl_<link>_pub. It decides which tables PostgreSQL sends
#      at all, so it must hold every link table AND the signalling table; a
#      table missing from it is silently never captured, and a signal
#      inserted into a signalling table missing from it is never seen.
#      The preflight checks both and prints the ALTER PUBLICATION to run.
#      dbz_pub below is the fallback for stacks created before that, which
#      keep it (the deployer never switches a running link's publication).
#   2. database.dbname (singular) is the database property, and the connector is
#      scoped to exactly one database. A link spanning two PostgreSQL databases
#      needs two connectors.
#   3. Topic shape is <prefix>.<schema>.<table>, so tables are written to
#      data:<prefix>.<schema>.<table> -- the schema, not the database, is the
#      middle segment. Default schema is public.
#   4. NO SCHEMA HISTORY. The logical decoding stream carries schema, so this
#      connector ignores the schema.history.internal properties the shared base
#      sets. They are harmless here; they are not silently doing something.
#   5. publication.autocreate.mode=disabled on purpose. Letting the connector
#      create the publication requires elevated grants and, with FOR ALL TABLES,
#      quietly starts capturing tables the link never asked for. Create the
#      publication explicitly as part of prerequisites.
#   6. THE SLOT ONLY MOVES WHEN DEBEZIUM RECEIVES SOMETHING (Jira story F011). Debezium
#      confirms a WAL position to the slot only for messages it receives, and
#      PostgreSQL sends it only changes to the publication's tables (from
#      PostgreSQL 15 not even empty transactions). While the captured tables
#      are idle and other tables, or RDS's own housekeeping, keep writing,
#      the slot does not move and WAL accumulates on the source until its disk fills.
#      So every heartbeat (heartbeat.interval.ms) also writes a logical
#      decoding message. It is part of no table, needs no grant (the function
#      is executable by every user), changes no data, and reaches Debezium
#      through the slot (PostgreSQL 14+ with pgoutput), which moves the
#      position on. message.prefix.exclude.list keeps it out of the broker.
#      On PostgreSQL 13 and older the message is not sent to Debezium and the
#      query does nothing, but there empty transactions still move the slot.
#      HEARTBEAT_ACTION_QUERY replaces the query (SELECT 1 turns it off). A
#      failing query logs ERROR at every heartbeat and does not stop capture.
# ═══════════════════════════════════════════════════════════════════════════

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.port=${SOURCE_DB_PORT:5432}
debezium.source.database.dbname=${SOURCE_DB_NAME}
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=${SLOT_NAME:ecdl_slot}
debezium.source.publication.name=${PUBLICATION:dbz_pub}
debezium.source.publication.autocreate.mode=disabled
debezium.source.snapshot.mode=${SNAPSHOT_MODE:no_data}
debezium.source.heartbeat.action.query=${HEARTBEAT_ACTION_QUERY:SELECT pg_logical_emit_message(false, 'ecdl-heartbeat', '')}
debezium.source.message.prefix.exclude.list=ecdl-heartbeat
