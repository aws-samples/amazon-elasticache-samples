[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "kvtrace"
dynamic = ["version"]
description = "Record vLLM/SGLang KV-cache events, simulate a shared L2 KV tier, and estimate savings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "TBD" }
dependencies = [
    "pyzmq>=27.2",
    # msgpack 1.2 requires Python >= 3.10; older interpreters get the newest compatible release.
    "msgpack>=1.2; python_version >= '3.10'",
    "msgpack>=1.0; python_version < '3.10'",
]

[project.optional-dependencies]
s3 = [
    "boto3>=1.43; python_version >= '3.10'",
    "boto3; python_version < '3.10'",
]
valkey = [
    "valkey>=6.2; python_version >= '3.11'",
    "valkey; python_version < '3.11'",
]
dev = [
    "pytest>=9.1; python_version >= '3.10'",
    "pytest; python_version < '3.10'",
    "ruff>=0.17",
]

[project.scripts]
kvtrace = "kvtrace.cli:main"

[tool.hatch.version]
path = "src/kvtrace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kvtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
# Verbatim copy of the benchmark kit's load driver; kept identical to its source.
extend-exclude = ["examples/overhead/mooncake_driver.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
